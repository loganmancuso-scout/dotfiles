# Termux terminal color scheme override — Catppuccin Latte (light) instead
# of Termux's default dark scheme. Pairs with dot_config/starship.toml.tmpl
# and dot_config/tmux/tmux.conf.tmpl, both of which also switch from
# Catppuccin Mocha to Latte when chezmoi.os == "android", so the terminal
# background, starship prompt, and tmux status bar all agree on light vs
# dark instead of mixing a light background with dark-theme accent colors.
# Official palette: https://catppuccin.com/palette (Latte)

