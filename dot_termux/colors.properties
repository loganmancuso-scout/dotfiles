#
# Termux terminal color scheme override — light background, dark text,
# instead of the terminal app's default dark scheme. Only meaningful under
# Termux (android); applied via `termux-reload-settings` after chezmoi
# writes this file. Leaves the 16 ANSI colors at Termux's defaults so
# colored command output (ls, git, starship, etc.) still reads correctly
# against the light background.

background=#FFFFFF
foreground=#000000
cursor=#000000
