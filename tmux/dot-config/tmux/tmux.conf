# Author: Logan Mancuso | LastEdit: 2026-03-23
# ~/.config/tmux/tmux.conf

# ─────────────────────────────────────────
# PLUGINS
# ─────────────────────────────────────────
# TPM (Tmux Plugin Manager) must be installed before plugins will load.
# On a fresh machine, run:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then inside tmux press: prefix + I to install all plugins below.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# ─────────────────────────────────────────
# GENERAL
# ─────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g mouse on
set -g history-limit 5000

# Start windows and panes at 1 (not 0)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Vi keys in copy mode
set-window-option -g mode-keys vi

# Reduce escape-time for neovim
set -sg escape-time 10

# ─────────────────────────────────────────
# PREFIX
# ─────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ─────────────────────────────────────────
# KEYBINDINGS
# ─────────────────────────────────────────
# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Split panes — open in current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (vim-style, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch to last active window
bind Tab last-window

# ─────────────────────────────────────────
# THEME — Catppuccin Mocha
# ─────────────────────────────────────────
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Window title format
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_number_position "left"

# ─────────────────────────────────────────
# STATUS BAR — Top (catppuccin modules)
# ─────────────────────────────────────────
set -g status-position top
set -g status-left-length 100
set -g status-right-length 100

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M"

# ─────────────────────────────────────────
# HINT BAR — Bottom (beginner keybinding reference)
# ─────────────────────────────────────────
# Enable two status lines (0 = top catppuccin bar, 1 = bottom hint bar)
set -g status 2

# Catppuccin Mocha palette
%hidden MOCHA_SURFACE0="#313244"
%hidden MOCHA_SURFACE1="#45475a"
%hidden MOCHA_OVERLAY0="#6c7086"
%hidden MOCHA_TEXT="#cdd6f4"
%hidden MOCHA_MAUVE="#cba6f7"
%hidden MOCHA_BLUE="#89b4fa"
%hidden MOCHA_GREEN="#a6e3a1"
%hidden MOCHA_YELLOW="#f9e2af"

# status-format[0] is the default top bar (catppuccin owns this)
# status-format[1] is the bottom hint bar
set -g status-format[1] "#[bg=#313244,fg=#6c7086]\
#[fg=#cba6f7,bold] ^Space #[fg=#cdd6f4,nobold]prefix \
#[fg=#45475a] │ \
#[fg=#89b4fa]| #[fg=#cdd6f4]split-h \
#[fg=#89b4fa]- #[fg=#cdd6f4]split-v \
#[fg=#45475a] │ \
#[fg=#a6e3a1]hjkl #[fg=#cdd6f4]navigate \
#[fg=#a6e3a1]HJKL #[fg=#cdd6f4]resize \
#[fg=#45475a] │ \
#[fg=#f9e2af]Tab #[fg=#cdd6f4]last-win \
#[fg=#f9e2af]r #[fg=#cdd6f4]reload \
#[fg=#45475a] │ \
#[fg=#cba6f7]I #[fg=#cdd6f4]install-plugins \
#[fg=#cba6f7]U #[fg=#cdd6f4]update-plugins "

# ─────────────────────────────────────────
# TPM — must remain at the very bottom
# ─────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
