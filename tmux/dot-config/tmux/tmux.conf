# Author: Logan Mancuso | LastEdit: 2026-03-23
# ~/.config/tmux/tmux.conf

# ─────────────────────────────────────────
# PLUGINS
# ─────────────────────────────────────────
# TPM (Tmux Plugin Manager) must be installed before plugins will load.
# On a fresh machine, run:
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Then inside tmux press: prefix + I to install all plugins below.

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux#v2.1.3'

# ─────────────────────────────────────────
# GENERAL
# ─────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

set -g mouse on
set -g history-limit 5000

# Start windows and panes at 1 (not 0)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Vi keys in copy mode
set-window-option -g mode-keys vi

# Reduce escape-time for neovim
set -sg escape-time 10

# ─────────────────────────────────────────
# PREFIX
# ─────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ─────────────────────────────────────────
# KEYBINDINGS
# ─────────────────────────────────────────
# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Split panes — open in current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (vim-style, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Switch to last active window
bind Tab last-window

# ─────────────────────────────────────────
# THEME — Catppuccin Mocha
# ─────────────────────────────────────────
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Window title format
set -g @catppuccin_window_default_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_number_position "left"

# ─────────────────────────────────────────
# STATUS BAR — Top (catppuccin modules)
# ─────────────────────────────────────────
set -g status-position top
set -g status-left-length 100
set -g status-right-length 100

set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

set -g @catppuccin_date_time_text "%Y-%m-%d %H:%M"

# ─────────────────────────────────────────
# HINT BAR — Bottom (beginner keybinding reference)
# ─────────────────────────────────────────
# Catppuccin Mocha palette
MOCHA_BASE="#1e1e2e"
MOCHA_SURFACE0="#313244"
MOCHA_SURFACE1="#45475a"
MOCHA_OVERLAY0="#6c7086"
MOCHA_TEXT="#cdd6f4"
MOCHA_MAUVE="#cba6f7"
MOCHA_BLUE="#89b4fa"
MOCHA_GREEN="#a6e3a1"
MOCHA_YELLOW="#f9e2af"

set -g status2 on
set -g status2-style "bg=${MOCHA_SURFACE0},fg=${MOCHA_OVERLAY0}"
set -g status2-left-length 220
set -g status2-right-length 0

set -g status2-left "\
#[bg=${MOCHA_SURFACE0},fg=${MOCHA_MAUVE},bold] ^Space #[fg=${MOCHA_TEXT},nobold]prefix \
#[fg=${MOCHA_SURFACE1}] │ \
#[fg=${MOCHA_BLUE}]| #[fg=${MOCHA_TEXT}]split-h \
#[fg=${MOCHA_BLUE}]- #[fg=${MOCHA_TEXT}]split-v \
#[fg=${MOCHA_SURFACE1}] │ \
#[fg=${MOCHA_GREEN}]hjkl #[fg=${MOCHA_TEXT}]navigate \
#[fg=${MOCHA_GREEN}]HJKL #[fg=${MOCHA_TEXT}]resize \
#[fg=${MOCHA_SURFACE1}] │ \
#[fg=${MOCHA_YELLOW}]Tab #[fg=${MOCHA_TEXT}]last-win \
#[fg=${MOCHA_YELLOW}]r #[fg=${MOCHA_TEXT}]reload \
#[fg=${MOCHA_SURFACE1}] │ \
#[fg=${MOCHA_MAUVE}]I #[fg=${MOCHA_TEXT}]install-plugins \
#[fg=${MOCHA_MAUVE}]U #[fg=${MOCHA_TEXT}]update-plugins "

# ─────────────────────────────────────────
# TPM — must remain at the very bottom
# ─────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
