# Author: Logan Mancuso | LastEdit: 2026-08-14
# 1Password SSH Agent key routing configuration
# Docs: https://developer.1password.com/docs/ssh/agent/config/
#
# NOTE: agent.toml only supports `item`/`vault`/`account` filters — there is
# no `match`/`hosts` field. Host-to-key routing belongs in ~/.ssh/config
# (see dot_ssh/config.tmpl), which already sets IdentityAgent per-host.
# All hosts previously grouped here (MGMT/Mobile/VPC/Edge/DEV-LAN) use the
# same single key, so they collapse into one entry.
#
# This filter also governs which keys op-ssh-sign (git commit signing) can
# access, not just the ssh-agent socket — so shared_ed (git signing key,
# see dot_ssh/allowed_signers) must be listed explicitly too.

[[ssh-keys]]
item = "personal_ed"
vault = "Private"
account = "my.1password.com"

[[ssh-keys]]
item = "shared_ed"
vault = "Private"
account = "my.1password.com"
